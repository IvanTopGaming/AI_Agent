server:
  port: 8080

spring:
  application:
    name: ai-support-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/support}
    username: ${SPRING_DATASOURCE_USERNAME:support}
    password: ${SPRING_DATASOURCE_PASSWORD:support}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

llm:
  api-url: ${LLM_API_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
